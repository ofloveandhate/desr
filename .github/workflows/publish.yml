name: publish

# A pushed tag publishes desr.  The tag must be `v` followed by exactly the version in
# desr/__init__.py.  A pre-release or development version (v3.0.0.dev1, v3.0.0rc1) goes to
# TestPyPI, to be looked at and installed first; a final version (v3.0.0) goes to PyPI,
# and once it is there, the GitHub release is made from the tag, with the version's
# section of CHANGELOG.md as its notes and the two files attached.  A development version
# gets no GitHub release: its tag exists only to try the upload.
#
# Uploads use trusted publishing: PyPI and TestPyPI each know this repository, this file
# and the environment named below, and no token is stored anywhere.  The one-time setup
# is in RELEASING.md.
#
# Only in ofloveandhate/desr.  A fork has no publisher registered, so the job would only
# fail there.

on:
  push:
    tags: ['v*']

jobs:
  tests:
    if: github.repository == 'ofloveandhate/desr'
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      index: ${{ steps.which.outputs.index }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Build and check both distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine packaging
          python -m build
          python -m twine check dist/*

      - name: The tag is the version, and says which index
        id: which
        run: python .github/scripts/release_index.py "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    if: needs.build.outputs.index == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/desr/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: build
    if: needs.build.outputs.index == 'pypi'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/desr/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    # After the PyPI upload, so a GitHub release never announces a version PyPI lacks.
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: The version's section of the changelog
        run: python .github/scripts/changelog_section.py "${GITHUB_REF_NAME#v}" > release-notes.md

      - name: Release, with the files PyPI has
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "desr ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md
