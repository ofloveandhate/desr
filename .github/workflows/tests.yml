name: tests

# Four test surfaces, because each of them catches something none of the others does.
# This was learned the hard way: during the Hermite convention work every one of these was
# green at a moment when the next was broken.
#
#   pytest            the real assertions
#   module doctests   the docstring examples
#   sphinx doctest    the worked examples in docs/source/examples/*.rst
#   sphinx html       the `.. plot::` directives -- the doctest builder does NOT run these,
#                     and two figures were broken while all ~900 doctests passed.  A
#                     script that draws a figure for a page lives beside that page, and
#                     this build is what runs it.
#
# The second axis is what `pip install desr` brings.  It has no extras: numpy, scipy and
# networkx are requirements, and matplotlib, which only the drawing needs, is not.
# `bare-install` proves on a fresh install what a test inside a full environment cannot:
# the requirements arrive, matplotlib does not, the reduction and the numerics work, and
# drawing says what is missing.

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:
  # publish.yml runs every check here before it builds anything.
  workflow_call:

jobs:
  tests:
    name: tests, python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is python-flint's floor and python-flint is not optional; see the comment in
        # setup.py.  3.9 is end-of-life (2025-10-31) and python-flint rejects it anyway.
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install desr, matplotlib for the figures, and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install . matplotlib pytest

      - name: Unit tests
        run: python -m pytest tests/ -v

      - name: Module doctests
        run: python -m pytest --doctest-modules desr/ -v

  bare-install:
    name: bare install, python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install desr and nothing else
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: The requirements arrived, and matplotlib did not
        run: |
          python - <<'PY'
          import importlib.util
          for name in ('numpy', 'scipy', 'networkx'):
              assert importlib.util.find_spec(name) is not None, name + ' was not installed'
          assert importlib.util.find_spec('matplotlib') is None, (
              'matplotlib is installed, so the step that draws proves nothing')
          print('numpy, scipy and networkx are present; matplotlib is not')
          PY

      - name: A whole symbolic workflow
        run: |
          python - <<'PY'
          from desr import ODESystem, ODETranslator, ReductionScheme

          system = ODESystem.from_equations(['dn/dt = n*(r*(1 - n/K) - k*p/(n+d))',
                                             'dp/dt = s*p*(1 - h*p/n)'])
          translator = ODETranslator(system)
          assert translator.scheme() == ReductionScheme.PARAMETER
          reduced = translator.translate()
          assert len(reduced.symbols) == translator.expected_variable_count()
          assert reduced.scheme == ReductionScheme.PARAMETER
          print(reduced)
          PY

      - name: The numerics and the symbol graph work
        run: |
          python - <<'PY'
          from desr import NumericTranslator, ODESystem

          system = ODESystem.from_equations(['dz/dt = -k*z'])
          translator = system.translator()
          print(NumericTranslator(translator.translate()))
          print(translator.symbol_graph())
          PY

      - name: Drawing says what is missing
        run: |
          python - <<'PY'
          try:
              import desr.figures
          except ImportError as exc:
              assert 'matplotlib' in str(exc), 'unhelpful message: ' + str(exc)
              print('desr.figures raised as it should:', exc)
          else:
              raise AssertionError('desr.figures imported without matplotlib')
          PY

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install desr and the docs toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install . matplotlib sphinx sphinxcontrib-bibtex sphinx-rtd-theme

      - name: Sphinx doctests
        run: python -m sphinx -b doctest docs/source docs/build/doctest

      # -W, so a warning fails the build.  The one deliberate warning -- the placeholder
      # arXiv bibliography key -- is excused in docs/source/conf.py, which says to remove
      # the excuse once the preprint exists.
      - name: HTML build, warnings are errors
        run: python -m sphinx -b html -W docs/source docs/build/html

      - name: Upload the built docs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: html-docs
          path: docs/build/html
          retention-days: 14

  # Line and branch coverage of the library, from the three things that execute it, kept
  # apart so the report can say which of them reached a line.  A function only a doctest
  # reaches is checked by string comparison and nothing else.
  #
  # There is no threshold, on purpose.  The number is not the point: the report is here
  # so that a gap is visible before it ships, and the useful reading of it is the list of
  # lines nothing reaches.  See .coveragerc.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install desr, the docs toolchain and coverage
        run: |
          python -m pip install --upgrade pip
          python -m pip install . matplotlib pytest coverage sphinx sphinxcontrib-bibtex sphinx-rtd-theme

      - name: Coverage from the unit tests
        run: python -m coverage run --data-file=.coverage.tests -m pytest tests/ -q

      - name: Coverage from the module doctests
        run: python -m coverage run --data-file=.coverage.modules -m pytest --doctest-modules desr/ -q

      - name: Coverage from the Sphinx doctests
        run: python -m coverage run --data-file=.coverage.sphinx -m sphinx -b doctest docs/source docs/build/doctest

      - name: What the unit tests reach on their own
        run: python -m coverage report --data-file=.coverage.tests

      - name: What all three reach together
        run: |
          python -m coverage combine --keep --data-file=.coverage .coverage.tests .coverage.modules .coverage.sphinx
          python -m coverage report
          python -m coverage html

      - name: Upload the line-by-line report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: htmlcov
          retention-days: 14
