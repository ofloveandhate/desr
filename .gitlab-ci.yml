# Sends a snapshot of each release tag to Zenodo, which mints the DOI.
#
# The image is a full `python:` image, not a `-slim` or `-alpine` one: the job runs
# `git archive`, and git is absent from those variants.
#
# `gitlab2zenodo` is pinned.  This job runs once per release, months apart, so an
# unpinned install would meet whatever is newest at the one moment that matters.
image: python:3.13

# Two flags g2z-send is deliberately not given:
#
#   -s / --sandbox   would send to sandbox.zenodo.org, a separate service with its own
#                    accounts, records and tokens.  Without it the upload goes to
#                    zenodo.org, so `zenodo_token` has to be a zenodo.org token and
#                    `zenodo_record` a zenodo.org record.
#   -p / --publish   publishing a Zenodo record cannot be undone.  The job leaves a draft
#                    on the record, to be read and published by hand.
#
# `zenodo_record` is the concept record -- the one that means "desr", rather than one
# version of it -- so it does not change from release to release.  `g2z-send` resolves it
# to the latest version itself.
send-snapshot:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+/
  script:
    - pip install gitlab2zenodo==0.0b8
    - git archive --format zip --output ${CI_COMMIT_TAG#v}.zip ${CI_COMMIT_TAG}
    - g2z-send -i $zenodo_record -t $zenodo_token -m .zenodo.json ${CI_COMMIT_TAG#v}.zip
